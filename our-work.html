<!DOCTYPE html>

<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Work — B-One Interior</title>
    <script src="assets/js/tailwind.min.js"></script>
    <script type="module" src="assets/js/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="style.css?v=1.1">
    <style>
        .ourwork-cols{display:flex;gap:12px;align-items:flex-start;}
        @media(min-width:768px){.ourwork-cols{gap:16px;}}
        .ourwork-col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;}
        @media(min-width:768px){.ourwork-col{gap:16px;}}
        .half-placeholder{height:10rem;flex-shrink:0;}
        @media(min-width:768px){.half-placeholder{height:12rem;}}
        /* Same wipe animation as home page hero — vertical line sweeps left->right uncovering image2 over image1 */
        .mr-reveal{position:relative;width:100%;height:20rem;overflow:hidden;background:#18181b;}
        @media(min-width:768px){.mr-reveal{height:24rem;}}
        .mr-reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
        .mr-after{clip-path:inset(0 100% 0 0);animation:mrClip 9s linear infinite;}
        .mr-line{position:absolute;top:0;bottom:0;left:0;width:3px;margin-left:-1.5px;z-index:5;background:linear-gradient(180deg,#F7E08A 0%,#D4AF37 50%,#8a6d1f 100%);box-shadow:0 0 12px 2px rgba(212,175,55,.65);opacity:0;animation:mrLine 9s linear infinite;}
        @keyframes mrClip{
            0%,12%{clip-path:inset(0 100% 0 0);opacity:1}
            45%,88%{clip-path:inset(0 0 0 0);opacity:1}
            96%{clip-path:inset(0 0 0 0);opacity:0}
            97%,99.9%{clip-path:inset(0 100% 0 0);opacity:0}
            100%{clip-path:inset(0 100% 0 0);opacity:1}
        }
        @keyframes mrLine{
            0%,12%{left:0%;opacity:0}
            13%{left:0%;opacity:1}
            45%{left:100%;opacity:1}
            52%,100%{left:100%;opacity:0}
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen">

                <a href="https://youtube.com/@believeone307?si=T7B9HvbORx00jtFK" target="_blank"><img src="images/youtube.png" alt="YouTube"><span>YouTube</span></a>

    <!-- Header -->

    <!-- Bottom Nav (mobile) -->
    <div class="fixedBottom" style="box-sizing: border-box; width: 100%; max-width: 100vw;">

                    <div class="text-[12px] tracking-tighter">Account</div>

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>

    <!-- Popup / Drawer for block details -->
    <div id="ourWorkDrawer" class="hidden fixed inset-0 z-50">
        <div id="ourWorkDrawerBackdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-end md:items-center justify-center p-0 md:p-4">
            <div id="ourWorkDrawerPanel" class="bg-zinc-900 border border-[#D4AF37]/30 rounded-t-2xl md:rounded-2xl w-full md:max-w-2xl max-h-[calc(85vh-18vw)] md:max-h-[90vh] mb-[18vw] md:mb-0 overflow-hidden flex flex-col shadow-2xl translate-y-full md:translate-y-0 md:scale-95 opacity-0 transition-all duration-300">
                <div class="flex items-center justify-between px-4 py-3 border-b border-[#D4AF37]/20 shrink-0">
                    <h3 id="ourWorkDrawerTitle" class="text-sm font-extrabold tracking-widest uppercase text-[#D4AF37] truncate pr-3">Details</h3>
                    <button id="ourWorkDrawerClose" class="w-8 h-8 rounded-full bg-black border border-[#D4AF37]/20 flex items-center justify-center text-white hover:bg-zinc-800 shrink-0"><ion-icon name="close"></ion-icon></button>
                </div>
                <div id="ourWorkDrawerBody" class="overflow-y-auto p-4 space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        function resolveOurWorkImageUrl(u) {
            if (!u) return "";
            if (u.startsWith("http://") || u.startsWith("https://") || u.startsWith("data:")) return u;
            const base = window.API_BASE_URL.replace(/\/$/, "");
            if (u.startsWith("/")) return base + u;
            return base + "/" + u;
        }
        function buildBlock(entry, idx) {
            const hasData = !!entry;
            const img1 = hasData ? resolveOurWorkImageUrl(entry.image1 || entry.image_1 || entry.before_image || entry.image || "") : "";
            const img2 = hasData ? resolveOurWorkImageUrl(entry.image2 || entry.image_2 || entry.after_image || entry.afterImage || "") : "";
            const title = hasData ? (entry.title || entry.name || "") : "";
            if (!hasData) {
                return `<div class="ourwork-block rounded-xl overflow-hidden border border-dashed border-[#D4AF37]/30 bg-zinc-900">
                    <div class="h-40 md:h-48 flex items-center justify-center bg-zinc-900 border-b border-dashed border-[#D4AF37]/20">
                        <span class="text-[10px] tracking-[0.2em] uppercase text-zinc-600">Empty</span>
                    </div>
                    <div class="h-40 md:h-48 flex items-center justify-center bg-zinc-900">
                        <span class="text-[10px] tracking-[0.2em] uppercase text-zinc-600">Empty</span>
                    </div>
                </div>`;
            }
            const top = img1
                ? `<img src="${img1}" alt="${title} before" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'">`
                : `<div class="w-full h-full flex items-center justify-center bg-zinc-900 text-zinc-600"><ion-icon name="image-outline" class="text-2xl"></ion-icon></div>`;
            const bottom = img2
                ? `<img src="${img2}" alt="${title} after" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'">`
                : `<div class="w-full h-full flex items-center justify-center bg-zinc-900 text-zinc-600"><ion-icon name="image-outline" class="text-2xl"></ion-icon></div>`;
            return `<div class="ourwork-block rounded-xl overflow-hidden border border-[#D4AF37]/20 bg-zinc-900 shadow cursor-pointer hover:border-[#D4AF37]/40 transition-colors" data-idx="${idx}" onclick="openOurWorkDrawer(${idx})">
                <div class="h-40 md:h-48 overflow-hidden bg-zinc-800">${top}</div>
                <div class="h-40 md:h-48 overflow-hidden bg-zinc-800 border-t border-[#D4AF37]/15">${bottom}</div>
                ${title ? `<div class="px-3 py-2 bg-black/40 border-t border-[#D4AF37]/10"><p class="text-[11px] tracking-widest uppercase text-[#D4AF37] truncate">${title}</p></div>` : ``}
            </div>`;
        }
        function getColCount() {
            const w = window.innerWidth;
            if (w < 768) return 2;
            if (w < 1024) return 3;
            return 4;
        }
        let _lastEntries = [];
        function formatDrawerValue(v) {
            if (v == null || v === "") return "—";
            if (typeof v === "string" && (v.startsWith("http://") || v.startsWith("https://"))) return `<a href="${v}" target="_blank" class="text-[#D4AF37] underline break-all">${v}</a>`;
            return String(v);
        }
        function openOurWorkDrawer(idx) {
            const entry = _lastEntries[idx];
            if (!entry) return;
            const drawer = document.getElementById("ourWorkDrawer");
            const panel = document.getElementById("ourWorkDrawerPanel");
            const titleEl = document.getElementById("ourWorkDrawerTitle");
            const bodyEl = document.getElementById("ourWorkDrawerBody");
            const title = entry.title || entry.name || `Work #${idx + 1}`;
            titleEl.textContent = title;
            const img1 = resolveOurWorkImageUrl(entry.image1 || entry.image_1 || entry.before_image || entry.image || "");
            const img2 = resolveOurWorkImageUrl(entry.image2 || entry.image_2 || entry.after_image || entry.afterImage || "");
            const skipKeys = new Set(["image1","image_1","image2","image_2","before_image","after_image","image","afterImage","title","name"]);
            let metaRows = "";
            for (const [k,v] of Object.entries(entry)) {
                if (skipKeys.has(k)) continue;
                if (typeof v === "object") continue;
                metaRows += `<div class="flex justify-between gap-3 py-2 border-b border-white/5 last:border-0"><span class="text-[10px] tracking-widest uppercase text-zinc-500 shrink-0">${k}</span><span class="text-xs text-white text-right break-all">${formatDrawerValue(v)}</span></div>`;
            }
            let imageBlock = "";
            if (img1 && img2) {
                imageBlock = `<div class="rounded-xl overflow-hidden border border-[#D4AF37]/20">
                    <div class="mr-reveal">
                        <img src="${img1}" alt="Before" loading="lazy" onerror="this.style.display='none'">
                        <img src="${img2}" alt="After" class="mr-after" loading="lazy" onerror="this.style.display='none'">
                        <div class="mr-line"></div>
                    </div>
                    <div class="flex justify-between px-3 py-1.5 bg-black/50 text-[10px] tracking-widest uppercase text-zinc-400"><span>Before</span><span>After</span></div>
                </div>`;
            } else if (img1 || img2) {
                const single = img1 || img2;
                imageBlock = `<div class="rounded-xl overflow-hidden border border-[#D4AF37]/20"><img src="${single}" alt="${title}" class="w-full h-auto max-h-[60vh] object-contain bg-black" onerror="this.style.display='none'"></div>`;
            } else {
                imageBlock = `<div class="rounded-xl border border-dashed border-white/10 bg-white/[0.02] h-32 flex items-center justify-center text-zinc-600"><ion-icon name="image-outline" class="text-3xl"></ion-icon></div>`;
            }
            bodyEl.innerHTML = `
                ${imageBlock}
                ${metaRows ? `<div class="rounded-xl border border-white/10 bg-white/[0.03] p-3">${metaRows}</div>` : `<p class="text-xs text-zinc-500 text-center py-2">No additional details</p>`}
            `;
            drawer.classList.remove("hidden");
            document.body.style.overflow = "hidden";
            requestAnimationFrame(() => {
                panel.classList.remove("translate-y-full","md:scale-95","opacity-0");
                panel.classList.add("translate-y-0","md:scale-100","opacity-100");
            });
        }
        function closeOurWorkDrawer() {
            const drawer = document.getElementById("ourWorkDrawer");
            const panel = document.getElementById("ourWorkDrawerPanel");
            panel.classList.add("translate-y-full","md:scale-95","opacity-0");
            panel.classList.remove("translate-y-0","md:scale-100","opacity-100");
            setTimeout(() => {
                drawer.classList.add("hidden");
                document.body.style.overflow = "";
            }, 300);
        }
        function renderMasonry(entries) {
            if (Array.isArray(entries)) _lastEntries = entries;
            const grid = document.getElementById("ourWorkGrid");
            const list = Array.isArray(_lastEntries) ? _lastEntries : [];
            const blocks = [];
            for (let i = 0; i < 10; i++) blocks.push(buildBlock(i < list.length ? list[i] : null, i));
            const colCount = getColCount();
            grid.innerHTML = "";
            grid.className = "ourwork-cols";
            const cols = [];
            for (let c = 0; c < colCount; c++) {
                const col = document.createElement("div");
                col.className = "ourwork-col";
                if (c % 2 === 1) {
                    const ph = document.createElement("div");
                    ph.className = "half-placeholder rounded-xl border border-dashed border-[#D4AF37]/30 bg-zinc-900/60 flex items-center justify-center";
                    col.appendChild(ph);
                }
                cols.push(col);
                grid.appendChild(col);
            }
            // Distribute 10 blocks round-robin across columns
            blocks.forEach((html, idx) => {
                const colIdx = idx % colCount;
                const tmp = document.createElement("div");
                tmp.innerHTML = html;
                cols[colIdx].appendChild(tmp.firstElementChild);
            });
        }
        async function loadOurWork() {
            const status = document.getElementById("ourWorkStatus");
            status.textContent = "Loading...";
            status.classList.remove("hidden");
            const url = window.API_BASE_URL + "/api/ourwork/works/?limit=10";
            try {
                const headers = { "Content-Type": "application/json" };
                const token = localStorage.getItem("saleor_auth_token");
                if (token) headers["Authorization"] = "Bearer " + token;
                const res = await fetch(url, { headers });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                let entries = [];
                if (Array.isArray(data)) entries = data;
                else if (Array.isArray(data.results)) entries = data.results;
                else if (Array.isArray(data.data)) entries = data.data;
                else if (Array.isArray(data.works)) entries = data.works;
                else if (Array.isArray(data.items)) entries = data.items;
                renderMasonry(entries);
                status.classList.add("hidden");
            } catch (e) {
                console.error("OurWork fetch failed:", e);
                renderMasonry([]);
                status.textContent = "Could not load — showing empty blocks.";
                status.classList.remove("hidden");
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            loadOurWork();
            document.getElementById("ourWorkDrawerBackdrop").addEventListener("click", closeOurWorkDrawer);
            document.getElementById("ourWorkDrawerClose").addEventListener("click", closeOurWorkDrawer);
            document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOurWorkDrawer(); });
        });
        let _resizeTimer;
        window.addEventListener("resize", function () {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(function () { renderMasonry(); }, 150);
        });
        // Bottom nav drawer helpers (matches site-wide drawer)
        function toggleDrawer() {
            const drawer = document.getElementById("drawer");
            const overlay = document.querySelector(".overlay");
            if (!drawer) return;
            if (drawer.style.left === "0px") {
                drawer.style.left = "-250px";
                if (overlay) { overlay.style.opacity = "0"; overlay.style.pointerEvents = "none"; }
            } else {
                drawer.style.left = "0px";
                if (overlay) { overlay.style.opacity = "1"; overlay.style.pointerEvents = "auto"; }
            }
        }
        (function(){
            const overlay = document.querySelector(".overlay");
            if (overlay) overlay.addEventListener("click", toggleDrawer);
        })();
        function openConsultationModal(){ alert("Consultation — please visit Contact Us"); }
    </script>
</body>
